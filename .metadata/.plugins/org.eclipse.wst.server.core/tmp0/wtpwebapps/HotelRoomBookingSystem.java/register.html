<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StayFinder | Register</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:linear-gradient(135deg,#071b30,#176b87);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;width:100%;max-width:480px;padding:35px;border-radius:18px;box-shadow:0 20px 50px #0005}
.logo{text-align:center;font-size:28px;font-weight:bold;color:#12355b}
.sub{text-align:center;color:#718096;margin:8px 0 25px}
label{display:block;font-size:13px;font-weight:bold;margin:14px 0 6px;color:#344054}
input{width:100%;padding:13px;border:1px solid #ccd3dc;border-radius:8px;font-size:14px;outline:none}
input:focus{border-color:#176b87}
button{width:100%;padding:14px;margin-top:22px;border:0;border-radius:8px;background:linear-gradient(135deg,#e19a28,#b96808);color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
.login{text-align:center;margin-top:20px;color:#667085;font-size:14px}
.login a{color:#12355b;font-weight:bold;text-decoration:none}
#error{color:red;font-size:12px;margin-top:5px}
</style>
</head>
<body>

<div class="box">
<div class="logo">🏨 StayFinder</div>
<div class="sub">Create your account</div>

<form action="register" method="post" onsubmit="return checkPassword()">

<label>Full Name</label>
<input type="text" name="full_name" placeholder="Enter your full name" required>

<label>Email Address</label>
<input type="email" name="email" placeholder="Enter your email" required>

<label>Phone Number</label>
<input type="tel" name="phone" placeholder="10 digit phone number"
       pattern="[0-9]{10}" maxlength="10" required>

<label>Password</label>
<input type="password" id="password" name="password"
       placeholder="Create password" minlength="6" required>

<label>Confirm Password</label>
<input type="password" id="confirm" placeholder="Confirm password"
       minlength="6" required>

<div id="error"></div>

<button type="submit">Create Account</button>

</form>

<div class="login">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>

<script>
function checkPassword(){
    let p=document.getElementById("password").value;
    let c=document.getElementById("confirm").value;
    if(p!==c){
        document.getElementById("error").innerText="Passwords do not match!";
        return false;
    }
    return true;
}
</script>

</body>
</html>
